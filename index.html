<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>TaskFlow — Task Manager</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>TaskFlow</h1>
    <p>Java Spring Boot REST API + Vanilla JS Frontend</p>
  </header>

  <main>
    <section class="form-card">
      <h2 id="form-title">Add Task</h2>
      <form id="task-form">
        <input type="hidden" id="task-id" />
        <input type="text" id="title" placeholder="Task title" required maxlength="120" />
        <textarea id="description" placeholder="Description" maxlength="500"></textarea>
        <div class="row">
          <select id="status">
            <option value="PENDING">Pending</option>
            <option value="IN_PROGRESS">In Progress</option>
            <option value="COMPLETED">Completed</option>
          </select>
          <select id="priority">
            <option value="LOW">Low</option>
            <option value="MEDIUM" selected>Medium</option>
            <option value="HIGH">High</option>
          </select>
          <input type="date" id="dueDate" />
        </div>
        <div class="row">
          <button type="submit" id="submit-btn">Add Task</button>
          <button type="button" id="cancel-btn" class="secondary hidden">Cancel</button>
        </div>
      </form>
    </section>

    <section class="list-card">
      <div class="list-header">
        <h2>Tasks</h2>
        <div class="filters">
          <input type="text" id="search" placeholder="Search by title..." />
          <select id="filter-status">
            <option value="">All</option>
            <option value="PENDING">Pending</option>
            <option value="IN_PROGRESS">In Progress</option>
            <option value="COMPLETED">Completed</option>
          </select>
        </div>
      </div>
      <div id="task-list"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
